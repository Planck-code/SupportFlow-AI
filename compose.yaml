x-app-db: &app-db
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-supportflow}
  DB_USER: ${DB_USER:-supportflow}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  DB_TIMEOUT: ${DB_TIMEOUT:-3s}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-supportflow}
      MYSQL_USER: ${DB_USER:-supportflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-db
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    environment: *app-db
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
